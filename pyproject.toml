[project]
name = "uoft-course-api"
version = "0.1.0"
description = "An API for University of Toronto course information"
authors = [
    {name = "Seran166",email = "seran.naventhan@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4",
    "fastapi",
    "psycopg[binary]",
    "pydantic>=2,<3",
    "python-dotenv",
    "requests",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn[standard]",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
